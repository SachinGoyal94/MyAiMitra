# GitHub CI/CD Workflow for deploying the Chatbot microservice to Azure Web App
name: Build and deploy Python app to Azure Web App - aimitra

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/Chatbot/**'
      - '.github/workflows/main_aimitra.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Azure App Service's startup script looks for this virtual environment
      # at /home/site/wwwroot/antenv.  Do not use a hidden .python_packages
      # directory here: upload-artifact excludes hidden files by default.
      - name: Install dependencies
        working-directory: Backend/Chatbot
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Bundles Chatbot source and the Azure-recognized antenv environment.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: Backend/Chatbot/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: ./app-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D430758B6BA0459A8F1A0C74BB91E870 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DECBC83B68314377BDE38F36794EE5E2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8670475D4A144F3CACD074F5FFCEE18A }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'aimitra'
          package: ./app-package
          # The artifact root is Backend/Chatbot, not the repository root.
          startup-command: 'gunicorn main:app --worker-class uvicorn.workers.UvicornWorker --workers 2 --bind 0.0.0.0:8000 --timeout 120'
